name: Feature request
description: Suggest an idea for RedTerm
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Check the README and existing issues first to
        avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or use case that motivates this feature
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine it working?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything you already tried or thought about
