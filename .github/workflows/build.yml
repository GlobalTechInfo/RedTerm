name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Fix gradle.properties for CI
        run: sed -i '/android\.aapt2FromMavenOverride/d' gradle.properties

      - name: Decode keystore
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/redterm-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          mkdir -p app/build/outputs/apk/release
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/RedTerm-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedTerm-${{ github.ref_name }}
          path: app/build/outputs/apk/release/RedTerm-*.apk

      - name: Detect prerelease tag
        id: detect
        run: |
          if [[ "${{ github.ref_name }}" =~ (beta|alpha|rc|preview|dev) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: RedTerm ${{ github.ref_name }}
          artifacts: app/build/outputs/apk/release/RedTerm-*.apk
          body: |
            RedTerm ${{ github.ref_name }} — automated release build.

            ## Install
            1. Download and install the APK
            2. Grant storage permissions when prompted

            ## Changelog
            *(see commits for details)*
          prerelease: ${{ steps.detect.outputs.prerelease }}
