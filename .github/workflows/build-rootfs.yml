name: Build Rootfs

on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'Distro to build (all, alpine, debian, ubuntu, arch, artix, manjaro, almalinux, fedora, rocky, kali, void)'
        required: false
        default: 'all'
  push:
    paths:
      - 'rootfs/**'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, x86_64, i686]
        include:
          - arch: aarch64
            qemu_arch: aarch64
          - arch: arm
            qemu_arch: arm
          - arch: x86_64
            qemu_arch: x86_64
          - arch: i686
            qemu_arch: i386

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        run: |
          sudo docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-user-static systemd-container \
            debootstrap zstd \
            dnf \
            wget curl git

      - name: Build rootfs
        run: |
          chmod +x rootfs/build.sh rootfs/builders/*.sh
          bash rootfs/build.sh ${{ matrix.arch }} "${{ github.event.inputs.distro || 'all' }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.arch }}
          path: output/*.tar.xz
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install gh
        run: sudo apt-get install -y -qq gh

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: find artifacts -name '*.tar.xz' -ls

      - name: Delete old release and tag
        run: |
          gh release delete "rootfs-v1" --yes --cleanup-tag 2>/dev/null || true
          git push --delete origin "rootfs-v1" 2>/dev/null || true
          git tag -d "rootfs-v1" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new release
        run: |
          gh release create "rootfs-v1" \
            --repo "${{ github.repository }}" \
            --title "Rootfs Images" \
            --generate-notes \
            artifacts/*.tar.xz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
